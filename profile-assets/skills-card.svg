<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 180" width="100%" height="180" role="img" aria-label="Languages and Technologies Skill Rack">
  
  <defs>
    <!-- Scanline pattern -->
    <pattern id="scanlines" width="100" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100" y2="0" stroke="#000000" stroke-width="1.2" opacity="0.32" />
    </pattern>

    <!-- Subtle Dot Grid -->
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.75" fill="#26313b" opacity="0.5" />
    </pattern>

    <!-- Cyan Glow Filter -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Green Glow Filter -->
    <filter id="glow-green" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Avatar Rounded Clip -->
    <clipPath id="avatar-clip">
      <rect x="36" y="72" width="128" height="128" rx="6" />
    </clipPath>
  </defs>
  

  <!-- Card Background -->
  <rect width="820" height="180" rx="8" fill="#0c0e12" stroke="#26313b" stroke-width="1.2" />
  <rect width="820" height="180" rx="8" fill="url(#dot-grid)" pointer-events="none" />

  
  <!-- Window Header Bar -->
  <path d="M 1 1 H 819 V 42 H 1 Z" fill="#11161c" />
  <line x1="1" y1="42" x2="819" y2="42" stroke="#26313b" stroke-width="1" />

  <!-- Terminal Control Buttons -->
  <circle cx="28" cy="21" r="5" fill="#ff6b6b" />
  <circle cx="44" cy="21" r="5" fill="#ffd166" />
  <circle cx="60" cy="21" r="5" fill="#00ff9f" />

  <!-- Title Text -->
  <text x="82" y="25" fill="#7d8995" font-family="ui-monospace, 'Cascadia Code', monospace" font-size="12" font-weight="600" letter-spacing="1">SYSTEM_MODULES: TECH_RACK</text>
  

  <!-- Right Status Indicator -->
  <rect x="684" y="10" width="112" height="22" rx="4" fill="#091410" stroke="#00e5ff" stroke-width="0.8" />
  <circle cx="698" cy="21" r="4" fill="#00e5ff" filter="url(#glow-green)" />
  <text x="709" y="25" fill="#00e5ff" font-family="ui-monospace, monospace" font-size="11" font-weight="700" letter-spacing="0.8">● COMPILED</text>
  

  
    <g transform="translate(28, 56)">
      <rect width="122" height="98" rx="4" fill="#11161c" stroke="#26313b" stroke-width="1" />
      <text x="12" y="22" fill="#7d8995" font-family="ui-monospace, monospace" font-size="9" font-weight="600" letter-spacing="0.8">CORE LANGUAGE</text>
      <text x="12" y="52" fill="#ffd166" font-family="ui-monospace, monospace" font-size="16" font-weight="800">C#</text>
      <rect x="12" y="68" width="98" height="18" rx="2" fill="#090d12" stroke="#1a2430" stroke-width="0.8" />
      <text x="61" y="80" text-anchor="middle" fill="#495763" font-family="ui-monospace, monospace" font-size="9" font-weight="700">PRIMARY</text>
    </g>
    
    <g transform="translate(158, 56)">
      <rect width="122" height="98" rx="4" fill="#11161c" stroke="#26313b" stroke-width="1" />
      <text x="12" y="22" fill="#7d8995" font-family="ui-monospace, monospace" font-size="9" font-weight="600" letter-spacing="0.8">GAME ENGINE</text>
      <text x="12" y="52" fill="#00e5ff" font-family="ui-monospace, monospace" font-size="16" font-weight="800">UNITY</text>
      <rect x="12" y="68" width="98" height="18" rx="2" fill="#090d12" stroke="#1a2430" stroke-width="0.8" />
      <text x="61" y="80" text-anchor="middle" fill="#495763" font-family="ui-monospace, monospace" font-size="9" font-weight="700">CORE</text>
    </g>
    
    <g transform="translate(288, 56)">
      <rect width="122" height="98" rx="4" fill="#11161c" stroke="#26313b" stroke-width="1" />
      <text x="12" y="22" fill="#7d8995" font-family="ui-monospace, monospace" font-size="9" font-weight="600" letter-spacing="0.8">VERSION CONTROL</text>
      <text x="12" y="52" fill="#ff6b6b" font-family="ui-monospace, monospace" font-size="16" font-weight="800">GIT</text>
      <rect x="12" y="68" width="98" height="18" rx="2" fill="#090d12" stroke="#1a2430" stroke-width="0.8" />
      <text x="61" y="80" text-anchor="middle" fill="#495763" font-family="ui-monospace, monospace" font-size="9" font-weight="700">WORKFLOW</text>
    </g>
    
    <g transform="translate(418, 56)">
      <rect width="122" height="98" rx="4" fill="#11161c" stroke="#26313b" stroke-width="1" />
      <text x="12" y="22" fill="#7d8995" font-family="ui-monospace, monospace" font-size="9" font-weight="600" letter-spacing="0.8">SCRIPTING / WEB</text>
      <text x="12" y="52" fill="#ffd166" font-family="ui-monospace, monospace" font-size="16" font-weight="800">JAVASCRIPT</text>
      <rect x="12" y="68" width="98" height="18" rx="2" fill="#090d12" stroke="#1a2430" stroke-width="0.8" />
      <text x="61" y="80" text-anchor="middle" fill="#495763" font-family="ui-monospace, monospace" font-size="9" font-weight="700">SECONDARY</text>
    </g>
    
    <g transform="translate(548, 56)">
      <rect width="122" height="98" rx="4" fill="#11161c" stroke="#26313b" stroke-width="1" />
      <text x="12" y="22" fill="#7d8995" font-family="ui-monospace, monospace" font-size="9" font-weight="600" letter-spacing="0.8">AUTOMATION</text>
      <text x="12" y="52" fill="#00ff9f" font-family="ui-monospace, monospace" font-size="16" font-weight="800">PYTHON</text>
      <rect x="12" y="68" width="98" height="18" rx="2" fill="#090d12" stroke="#1a2430" stroke-width="0.8" />
      <text x="61" y="80" text-anchor="middle" fill="#495763" font-family="ui-monospace, monospace" font-size="9" font-weight="700">TOOLS</text>
    </g>
    
    <g transform="translate(678, 56)">
      <rect width="122" height="98" rx="4" fill="#11161c" stroke="#26313b" stroke-width="1" />
      <text x="12" y="22" fill="#7d8995" font-family="ui-monospace, monospace" font-size="9" font-weight="600" letter-spacing="0.8">ALGORITHMS</text>
      <text x="12" y="52" fill="#00e5ff" font-family="ui-monospace, monospace" font-size="16" font-weight="800">JAVA</text>
      <rect x="12" y="68" width="98" height="18" rx="2" fill="#090d12" stroke="#1a2430" stroke-width="0.8" />
      <text x="61" y="80" text-anchor="middle" fill="#495763" font-family="ui-monospace, monospace" font-size="9" font-weight="700">FOUNDATION</text>
    </g>
    

  <!-- CRT Scanlines Overlay -->
  <rect width="820" height="180" rx="8" fill="url(#scanlines)" pointer-events="none" />

  
  <g stroke="#00e5ff" stroke-width="1.5" fill="none" opacity="0.75">
    <path d="M 10 20 L 10 10 L 20 10" />
    <path d="M 800 10 L 810 10 L 810 20" />
    <path d="M 10 160 L 10 170 L 20 170" />
    <path d="M 800 170 L 810 170 L 810 160" />
  </g>
  
</svg>