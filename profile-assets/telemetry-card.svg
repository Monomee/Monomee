<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 240" width="100%" height="240" role="img" aria-label="GitHub Telemetry and Statistics">
  
  <defs>
    <style>
      @keyframes blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      .blink {
        animation: blink 1s infinite;
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.65; }
        50% { opacity: 1; filter: drop-shadow(0 0 3px #00ff9f); }
      }
      .pulse {
        animation: pulse 2s ease-in-out infinite;
      }
    </style>

    <!-- Scanline pattern -->
    <pattern id="scanlines" width="100" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100" y2="0" stroke="#000000" stroke-width="1.2" opacity="0.32" />
    </pattern>

    <!-- Subtle Dot Grid -->
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.75" fill="#26313b" opacity="0.5" />
    </pattern>

    <!-- Cyan Glow Filter -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Green Glow Filter -->
    <filter id="glow-green" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Avatar Rounded Clip -->
    <clipPath id="avatar-clip">
      <rect x="36" y="72" width="128" height="128" rx="6" />
    </clipPath>
  </defs>
  

  <!-- Card Background -->
  <rect width="820" height="240" rx="8" fill="#0c0e12" stroke="#26313b" stroke-width="1.2" />
  <rect width="820" height="240" rx="8" fill="url(#dot-grid)" pointer-events="none" />

  
  <!-- Window Header Bar -->
  <path d="M 1 1 H 819 V 42 H 1 Z" fill="#11161c" />
  <line x1="1" y1="42" x2="819" y2="42" stroke="#26313b" stroke-width="1" />

  <!-- Terminal Control Buttons -->
  <circle cx="28" cy="21" r="5" fill="#ff6b6b" />
  <circle cx="44" cy="21" r="5" fill="#ffd166" />
  <circle cx="60" cy="21" r="5" fill="#00ff9f" />

  <!-- Title Text -->
  <text x="82" y="25" fill="#7d8995" font-family="ui-monospace, 'Cascadia Code', monospace" font-size="12" font-weight="600" letter-spacing="1">GITHUB_TELEMETRY.sys</text>
  

  <!-- Right Status Indicator -->
  <rect x="684" y="10" width="112" height="22" rx="4" fill="#091410" stroke="#00ff9f" stroke-width="0.8" />
  <circle cx="698" cy="21" r="4" fill="#00ff9f" filter="url(#glow-green)" class="pulse" />
  <text x="709" y="25" fill="#00ff9f" font-family="ui-monospace, monospace" font-size="11" font-weight="700" letter-spacing="0.8">● LIVE DATA</text>
  

  <!-- Metrics Row (4 modules) -->
  <!-- Box 1: Repositories -->
  <g transform="translate(28, 56)">
    <rect width="180" height="66" rx="4" fill="#11161c" stroke="#26313b" stroke-width="1" />
    <text x="16" y="22" fill="#7d8995" font-family="ui-monospace, monospace" font-size="10" font-weight="600" letter-spacing="1">REPOSITORIES</text>
    <text x="16" y="49" fill="#00e5ff" font-family="ui-monospace, monospace" font-size="24" font-weight="800">33</text>
    <text x="74" y="47" fill="#495763" font-family="ui-monospace, monospace" font-size="10">PUBLIC REPOS</text>
  </g>

  <!-- Box 2: Total Stars -->
  <g transform="translate(222, 56)">
    <rect width="180" height="66" rx="4" fill="#11161c" stroke="#26313b" stroke-width="1" />
    <text x="16" y="22" fill="#7d8995" font-family="ui-monospace, monospace" font-size="10" font-weight="600" letter-spacing="1">TOTAL STARS</text>
    <text x="16" y="49" fill="#ffd166" font-family="ui-monospace, monospace" font-size="24" font-weight="800">4</text>
    <text x="74" y="47" fill="#495763" font-family="ui-monospace, monospace" font-size="10">STARS EARNED</text>
  </g>

  <!-- Box 3: Followers -->
  <g transform="translate(416, 56)">
    <rect width="180" height="66" rx="4" fill="#11161c" stroke="#26313b" stroke-width="1" />
    <text x="16" y="22" fill="#7d8995" font-family="ui-monospace, monospace" font-size="10" font-weight="600" letter-spacing="1">FOLLOWERS</text>
    <text x="16" y="49" fill="#00ff9f" font-family="ui-monospace, monospace" font-size="24" font-weight="800">2</text>
    <text x="74" y="47" fill="#495763" font-family="ui-monospace, monospace" font-size="10">DEV NETWORK</text>
  </g>

  <!-- Box 4: Stack Focus -->
  <g transform="translate(610, 56)">
    <rect width="182" height="66" rx="4" fill="#11161c" stroke="#26313b" stroke-width="1" />
    <text x="16" y="22" fill="#7d8995" font-family="ui-monospace, monospace" font-size="10" font-weight="600" letter-spacing="1">PRIMARY TECH</text>
    <text x="16" y="49" fill="#e8edf2" font-family="ui-monospace, monospace" font-size="19" font-weight="800">C# / UNITY</text>
    <text x="122" y="47" fill="#495763" font-family="ui-monospace, monospace" font-size="10">CORE</text>
  </g>

  <!-- Activity Telemetry Readout Box -->
  <g id="activity-telemetry">
    <rect x="28" y="134" width="764" height="88" rx="4" fill="#090d12" stroke="#1a2430" stroke-width="1" />
    
    <!-- Title Line -->
    <text x="44" y="154" fill="#7d8995" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700" letter-spacing="1">ACTIVITY MATRIX</text>
    <text x="774" y="154" text-anchor="end" fill="#00ff9f" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700">PIPELINE: NORMAL</text>

    <!-- Render Blocks -->
    <rect x="44.0" y="168" width="26" height="15" rx="2" fill="#00e5ff" fill-opacity="0.9" /><rect x="73.5" y="168" width="26" height="15" rx="2" fill="#00ff9f" fill-opacity="0.65" /><rect x="103.0" y="168" width="26" height="15" rx="2" fill="#00ff9f" fill-opacity="0.65" /><rect x="132.5" y="168" width="26" height="15" rx="2" fill="#00ff9f" fill-opacity="0.95" /><rect x="162.0" y="168" width="26" height="15" rx="2" fill="#00ff9f" fill-opacity="0.65" /><rect x="191.5" y="168" width="26" height="15" rx="2" fill="#00e5ff" fill-opacity="0.9" /><rect x="221.0" y="168" width="26" height="15" rx="2" fill="#00ff9f" fill-opacity="0.95" /><rect x="250.5" y="168" width="26" height="15" rx="2" fill="#00ff9f" fill-opacity="0.65" /><rect x="280.0" y="168" width="26" height="15" rx="2" fill="#00ff9f" fill-opacity="0.65" /><rect x="309.5" y="168" width="26" height="15" rx="2" fill="#00ff9f" fill-opacity="0.95" /><rect x="339.0" y="168" width="26" height="15" rx="2" fill="#00e5ff" fill-opacity="0.9" /><rect x="368.5" y="168" width="26" height="15" rx="2" fill="#00ff9f" fill-opacity="0.65" /><rect x="398.0" y="168" width="26" height="15" rx="2" fill="#00ff9f" fill-opacity="0.95" /><rect x="427.5" y="168" width="26" height="15" rx="2" fill="#00ff9f" fill-opacity="0.65" /><rect x="457.0" y="168" width="26" height="15" rx="2" fill="#ffd166" fill-opacity="0.9" /><rect x="486.5" y="168" width="26" height="15" rx="2" fill="#00e5ff" fill-opacity="0.9" /><rect x="516.0" y="168" width="26" height="15" rx="2" fill="#00ff9f" fill-opacity="0.65" /><rect x="545.5" y="168" width="26" height="15" rx="2" fill="#00ff9f" fill-opacity="0.65" /><rect x="575.0" y="168" width="26" height="15" rx="2" fill="#00e5ff" fill-opacity="0.5" /><rect x="604.5" y="168" width="26" height="15" rx="2" fill="#00e5ff" fill-opacity="0.5" /><rect x="634.0" y="168" width="26" height="15" rx="2" fill="#00e5ff" fill-opacity="0.5" /><rect x="663.5" y="168" width="26" height="15" rx="2" fill="#00e5ff" fill-opacity="0.5" /><rect x="693.0" y="168" width="26" height="15" rx="2" fill="#1a2430" fill-opacity="0.45" /><rect x="722.5" y="168" width="26" height="15" rx="2" fill="#1a2430" fill-opacity="0.45" /><rect x="752.0" y="168" width="26" height="15" rx="2" fill="#1a2430" fill-opacity="0.45" /><rect x="781.5" y="168" width="26" height="15" rx="2" fill="#1a2430" fill-opacity="0.45" />

    <!-- Status Text line below blocks -->
    <text x="44" y="206" fill="#7d8995" font-family="ui-monospace, monospace" font-size="11">&gt; telemetry_sync: 30 active events detected in telemetry window</text>
    <text x="774" y="206" text-anchor="end" fill="#00e5ff" font-family="ui-monospace, monospace" font-size="11" font-weight="600">[ CAPACITY: 88% ]</text>
  </g>

  <!-- CRT Scanlines Overlay -->
  <rect width="820" height="240" rx="8" fill="url(#scanlines)" pointer-events="none" />

  
  <g stroke="#00e5ff" stroke-width="1.5" fill="none" opacity="0.75">
    <path d="M 10 20 L 10 10 L 20 10" />
    <path d="M 800 10 L 810 10 L 810 20" />
    <path d="M 10 220 L 10 230 L 20 230" />
    <path d="M 800 230 L 810 230 L 810 220" />
  </g>
  
</svg>