<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 230" width="100%" height="230" role="img" aria-label="Featured Game Project: Mixie Empire Boba and Ice Cream">
  
  <defs>
    <!-- Scanline pattern -->
    <pattern id="scanlines" width="100" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100" y2="0" stroke="#000000" stroke-width="1.2" opacity="0.32" />
    </pattern>

    <!-- Subtle Dot Grid -->
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.75" fill="#26313b" opacity="0.5" />
    </pattern>

    <!-- Cyan Glow Filter -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Green Glow Filter -->
    <filter id="glow-green" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Avatar Rounded Clip -->
    <clipPath id="avatar-clip">
      <rect x="36" y="72" width="128" height="128" rx="6" />
    </clipPath>
  </defs>
  

  <!-- Card Background -->
  <rect width="820" height="230" rx="8" fill="#0c0e12" stroke="#26313b" stroke-width="1.2" />
  <rect width="820" height="230" rx="8" fill="url(#dot-grid)" pointer-events="none" />

  
  <!-- Window Header Bar -->
  <path d="M 1 1 H 819 V 42 H 1 Z" fill="#11161c" />
  <line x1="1" y1="42" x2="819" y2="42" stroke="#26313b" stroke-width="1" />

  <!-- Terminal Control Buttons -->
  <circle cx="28" cy="21" r="5" fill="#ff6b6b" />
  <circle cx="44" cy="21" r="5" fill="#ffd166" />
  <circle cx="60" cy="21" r="5" fill="#00ff9f" />

  <!-- Title Text -->
  <text x="82" y="25" fill="#7d8995" font-family="ui-monospace, 'Cascadia Code', monospace" font-size="12" font-weight="600" letter-spacing="1">PROJECT_ARCHIVE // 01_FEATURED_RELEASE</text>
  <text x="210" y="25" fill="#495763" font-family="ui-monospace, monospace" font-size="11">// GAME_SPOTLIGHT</text>

  <!-- Right Status Indicator -->
  <rect x="684" y="10" width="112" height="22" rx="4" fill="#091410" stroke="#ffd166" stroke-width="0.8" />
  <circle cx="698" cy="21" r="4" fill="#ffd166" filter="url(#glow-green)" />
  <text x="709" y="25" fill="#ffd166" font-family="ui-monospace, monospace" font-size="11" font-weight="700" letter-spacing="0.8">● RELEASED</text>
  

  <!-- Left: Game Terminal Hologram Box -->
  <g transform="translate(28, 56)">
    <rect width="144" height="152" rx="6" fill="#11161c" stroke="#26313b" stroke-width="1.2" />
    
    <!-- Viewfinder Tech Corners -->
    <path d="M 4 10 L 4 4 L 10 4" stroke="#ffd166" stroke-width="2" fill="none" />
    <path d="M 140 10 L 140 4 L 134 4" stroke="#ffd166" stroke-width="2" fill="none" />
    <path d="M 4 142 L 4 148 L 10 148" stroke="#ffd166" stroke-width="2" fill="none" />
    <path d="M 140 142 L 140 148 L 134 148" stroke="#ffd166" stroke-width="2" fill="none" />

    <!-- Gamepad Vector Icon -->
    <g transform="translate(36, 26)" stroke="#00e5ff" stroke-width="1.8" fill="none">
      <rect x="0" y="8" width="72" height="42" rx="14" fill="#0d141e" />
      <!-- D-Pad -->
      <path d="M 16 29 H 28 M 22 23 V 35" stroke="#00e5ff" stroke-width="2.5" stroke-linecap="round" />
      <!-- Action Buttons -->
      <circle cx="50" cy="24" r="2.2" fill="#ffd166" stroke="none" />
      <circle cx="58" cy="29" r="2.2" fill="#ff6b6b" stroke="none" />
      <circle cx="44" cy="31" r="2.2" fill="#00ff9f" stroke="none" />
      <circle cx="52" cy="36" r="2.2" fill="#00e5ff" stroke="none" />
    </g>

    <!-- Genre & Tags -->
    <text x="72" y="98" text-anchor="middle" fill="#ffd166" font-family="ui-monospace, monospace" font-size="11" font-weight="700">TYCOON / SIM</text>
    <text x="72" y="118" text-anchor="middle" fill="#00e5ff" font-family="ui-monospace, monospace" font-size="10" font-weight="600">UNITY 2D/3D</text>
    <text x="72" y="136" text-anchor="middle" fill="#7d8995" font-family="ui-monospace, monospace" font-size="9.5">ITCH.IO LIVE</text>
  </g>

  <!-- Right: Project Description & Specs -->
  <g transform="translate(192, 56)">
    <!-- Subtitle Tag -->
    <text x="0" y="16" fill="#00e5ff" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700" letter-spacing="1.5">FEATURED GAME PROJECT</text>

    <!-- Game Title -->
    <text x="0" y="44" fill="#e8edf2" font-family="ui-monospace, 'Cascadia Code', monospace" font-size="22" font-weight="800" letter-spacing="1">MIXIE EMPIRE: BOBA &amp; ICE CREAM</text>

    <!-- Tech Badges -->
    <g transform="translate(0, 58)">
      <rect x="0" y="0" width="100" height="22" rx="3" fill="#141f2b" stroke="#26313b" />
      <text x="50" y="15" text-anchor="middle" fill="#00e5ff" font-family="ui-monospace, monospace" font-size="10.5" font-weight="600">Unity Engine</text>

      <rect x="108" y="0" width="70" height="22" rx="3" fill="#141f2b" stroke="#26313b" />
      <text x="143" y="15" text-anchor="middle" fill="#ffd166" font-family="ui-monospace, monospace" font-size="10.5" font-weight="600">C# Core</text>

      <rect x="186" y="0" width="134" height="22" rx="3" fill="#141f2b" stroke="#26313b" />
      <text x="253" y="15" text-anchor="middle" fill="#e8edf2" font-family="ui-monospace, monospace" font-size="10.5" font-weight="600">Shop Management</text>

      <rect x="328" y="0" width="134" height="22" rx="3" fill="#141f2b" stroke="#26313b" />
      <text x="395" y="15" text-anchor="middle" fill="#7d8995" font-family="ui-monospace, monospace" font-size="10.5" font-weight="600">Gameplay Systems</text>
    </g>

    <!-- Game Synopsis -->
    <text x="0" y="104" fill="#e8edf2" font-family="ui-monospace, monospace" font-size="12">Build, automate, and serve desserts in a cozy cafe tycoon simulation game.</text>
    <text x="0" y="124" fill="#7d8995" font-family="ui-monospace, monospace" font-size="11.5">Engineered state machines, order queue processing, shop economy, and juice effects.</text>

    <!-- Interactive Link Button Look -->
    <g transform="translate(0, 136)">
      <rect width="180" height="28" rx="4" fill="#00e5ff" fill-opacity="0.12" stroke="#00e5ff" stroke-width="1" />
      <text x="90" y="18" text-anchor="middle" fill="#00e5ff" font-family="ui-monospace, monospace" font-size="11" font-weight="700">▶ PLAY ON ITCH.IO ↗</text>

      <text x="195" y="18" fill="#495763" font-family="ui-monospace, monospace" font-size="10.5">&gt; monomee.itch.io/mixie-empire-boba-and-ice-cream</text>
    </g>
  </g>

  <!-- CRT Scanlines Overlay -->
  <rect width="820" height="230" rx="8" fill="url(#scanlines)" pointer-events="none" />

  
  <g stroke="#00e5ff" stroke-width="1.5" fill="none" opacity="0.75">
    <path d="M 10 20 L 10 10 L 20 10" />
    <path d="M 800 10 L 810 10 L 810 20" />
    <path d="M 10 210 L 10 220 L 20 220" />
    <path d="M 800 220 L 810 220 L 810 210" />
  </g>
  
</svg>