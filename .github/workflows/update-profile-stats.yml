name: Update Profile Telemetry & Cards

on:
  schedule:
    # Run every Monday at 03:17 UTC
    - cron: "17 3 * * 1"
  workflow_dispatch:
  push:
    paths:
      - "scripts/**"
      - "lib/**"

permissions:
  contents: write

jobs:
  update-profile-cards:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate Profile HUD Cards
        run: node scripts/generate_assets.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit & Push generated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-assets/*.svg
          git diff --cached --quiet || git commit -m "chore(telemetry): update profile HUD cards"
          git push
